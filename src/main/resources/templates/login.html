<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng nhập</title>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a; color: #f5f5f0;
            font-family: 'DM Sans', sans-serif; font-weight: 300;
            min-height: 100vh; display: flex;
            align-items: center; justify-content: center;
        }
        .bg-grid {
            position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px; pointer-events: none;
        }
        .card {
            position: relative; width: 420px;
            border: 1px solid #2a2a2a; background: #111; padding: 3rem;
        }
        .brand {
            font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem;
            letter-spacing: 3px; margin-bottom: 2.5rem;
            display: block; text-decoration: none; color: #f5f5f0;
        }
        .brand span { color: #e8ff00; }
        h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 2px; margin-bottom: 0.5rem; }
        .subtitle { font-size: 0.8rem; color: #666; letter-spacing: 1px; margin-bottom: 2.5rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; color: #666; margin-bottom: 0.6rem; }
        input {
            width: 100%; padding: 0.9rem 1rem;
            background: #0a0a0a; border: 1px solid #2a2a2a;
            color: #f5f5f0; font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem; outline: none; transition: border-color 0.2s;
        }
        input:focus { border-color: #e8ff00; }
        .alert { padding: 0.8rem 1rem; font-size: 0.8rem; letter-spacing: 0.5px; margin-bottom: 1.5rem; }
        .alert-error { background: rgba(255,45,45,0.1); border: 1px solid #ff2d2d; color: #ff2d2d; }
        .alert-success { background: rgba(232,255,0,0.08); border: 1px solid #e8ff00; color: #e8ff00; }
        .btn-submit {
            width: 100%; padding: 1rem; background: #e8ff00; color: #0a0a0a;
            border: none; font-family: 'DM Sans', sans-serif; font-weight: 500;
            font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s; margin-bottom: 1rem;
        }
        .btn-submit:hover { background: #f5f5f0; }
        .btn-register {
            display: block; width: 100%; padding: 1rem;
            background: transparent; color: #f5f5f0; border: 1px solid #2a2a2a;
            font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
            letter-spacing: 2px; text-transform: uppercase;
            text-align: center; text-decoration: none; transition: all 0.2s;
        }
        .btn-register:hover { border-color: #f5f5f0; }
        .divider { text-align: center; font-size: 0.7rem; color: #444; letter-spacing: 2px; margin: 1rem 0; }
        .forgot { display: block; text-align: right; font-size: 0.75rem; color: #555; text-decoration: none; margin-top: 0.5rem; }
        .forgot:hover { color: #e8ff00; }
    </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="card">
    <a href="/" class="brand">CINE<span>MA</span></a>
    <h2>ĐĂNG NHẬP</h2>
    <p class="subtitle">Chào mừng trở lại</p>

    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error"   th:if="${error}"   th:text="${error}"></div>
    <div class="alert alert-error"   th:if="${param.error}">Email hoặc mật khẩu không đúng.</div>
    <div class="alert alert-success" th:if="${param.logout}">Đăng xuất thành công.</div>
    <div class="alert alert-success" th:if="${param.registered}">Đăng ký thành công! Hãy đăng nhập.</div>

    <form method="post" th:action="@{/login}">
        <div class="form-group">
            <label>Email</label>
            <input type="email" name="email" placeholder="example@email.com" required autofocus>
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" name="password" placeholder="••••••••" required>
            <a href="#" class="forgot">Quên mật khẩu?</a>
        </div>
        <button type="submit" class="btn-submit">Đăng nhập</button>
    </form>

    <div class="divider">CHƯA CÓ TÀI KHOẢN?</div>
    <a href="/register" class="btn-register">Tạo tài khoản</a>
</div>
</body>
</html>
