<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Cinema Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

    <!--
      Dòng này GIỮ NGUYÊN như cũ: th:replace sidebar.html fragment "sidebar"
      Sidebar mới sẽ tự lấy ${menus} từ model do controller truyền vào
    -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="container-fluid mt-3">
        <div class="row">
            <div class="col-md-12">
                <div th:replace="~{${contentTemplate} :: ${contentFragment}}"></div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS cần thiết cho dropdown menu -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
