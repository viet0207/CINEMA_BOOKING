<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng ký</title>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            color: #f5f5f0;
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }
        .card {
            position: relative;
            width: 420px;
            border: 1px solid #2a2a2a;
            background: #111;
            padding: 3rem;
        }
        .brand {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 3px;
            margin-bottom: 2.5rem;
            display: block;
            text-decoration: none;
            color: #f5f5f0;
        }
        .brand span { color: #e8ff00; }
        h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 1px;
            margin-bottom: 2.5rem;
        }
        .form-group { margin-bottom: 1.5rem; }
        label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 0.6rem;
        }
        input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            color: #f5f5f0;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #e8ff00; }
        .error {
            background: rgba(255,45,45,0.1);
            border: 1px solid #ff2d2d;
            color: #ff2d2d;
            padding: 0.8rem 1rem;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            margin-bottom: 1.5rem;
        }
        small {
            display: block;
            color: #ff2d2d;
            font-size: 0.75rem;
            margin-top: 0.4rem;
        }
        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: #e8ff00;
            color: #0a0a0a;
            border: none;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        .btn-submit:hover { background: #f5f5f0; }
        .btn-login {
            display: block;
            width: 100%;
            padding: 1rem;
            background: transparent;
            color: #f5f5f0;
            border: 1px solid #2a2a2a;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-login:hover { border-color: #f5f5f0; color: #f5f5f0; }
        .divider {
            text-align: center;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 2px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
<div class="bg-grid"></div>
<div class="card">
    <a href="/" class="brand">CINE<span>MA</span></a>
    <h2>ĐĂNG KÝ</h2>
    <p class="subtitle">Tạo tài khoản mới</p>

    <form method="post" action="/register" onsubmit="return validateForm()">

        <div class="form-group">
            <label>Họ tên</label>
            <input type="text" id="fullName" name="fullName" placeholder="Nguyễn Văn A" required>
            <small id="fullNameError"></small>
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
            <small id="emailError"></small>
        </div>

        <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" id="phone" name="phone" placeholder="0901234567">
            <small id="phoneError"></small>
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            <small id="passwordError"></small>
        </div>

        <div class="form-group">
            <label>Xác nhận mật khẩu</label>
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
            <small id="confirmError"></small>
        </div>

        <div class="error" th:if="${error}" th:text="${error}"></div>

        <button type="submit" class="btn-submit">Tạo tài khoản</button>
    </form>

    <div class="divider">ĐÃ CÓ TÀI KHOẢN?</div>
    <a href="/login" class="btn-login">Đăng nhập</a>
</div>

<script>
    function validateForm() {
        let isValid = true;

        document.getElementById("fullNameError").innerText = "";
        document.getElementById("emailError").innerText = "";
        document.getElementById("phoneError").innerText = "";
        document.getElementById("passwordError").innerText = "";
        document.getElementById("confirmError").innerText = "";

        let fullName = document.getElementById("fullName").value.trim();
        if (fullName === "") {
            document.getElementById("fullNameError").innerText = "Họ tên không được để trống.";
            isValid = false;
        }

        let email = document.getElementById("email").value.trim();
        let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(email)) {
            document.getElementById("emailError").innerText = "Email không đúng định dạng.";
            isValid = false;
        }

        let phone = document.getElementById("phone").value.trim();
        if (phone !== "" && !/^[0-9]{10,11}$/.test(phone)) {
            document.getElementById("phoneError").innerText = "Số điện thoại phải có 10-11 chữ số.";
            isValid = false;
        }

        let password = document.getElementById("password").value;
        if (password.length < 6) {
            document.getElementById("passwordError").innerText = "Mật khẩu phải có ít nhất 6 ký tự.";
            isValid = false;
        }

        let confirm = document.getElementById("confirmPassword").value;
        if (password !== confirm) {
            document.getElementById("confirmError").innerText = "Mật khẩu xác nhận không khớp.";
            isValid = false;
        }

        return isValid;
    }
</script>
</body>
</html>
