<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Tài khoản của tôi - Cinema</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a0a; color: #f5f5f0; font-family: 'DM Sans', sans-serif; }

        nav {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.2rem 4rem; border-bottom: 1px solid #1a1a1a;
            background: rgba(10,10,10,0.95); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 3px; text-decoration: none; color: #f5f5f0; }
        .logo span { color: #e8ff00; }
        .nav-links { display: flex; gap: 1rem; align-items: center; }
        .nav-email { font-size: 0.8rem; color: #666; }
        .btn-nav {
            padding: 0.5rem 1.4rem; border: 1px solid #333;
            background: transparent; color: #f5f5f0;
            font-family: 'DM Sans', sans-serif; font-size: 0.8rem;
            letter-spacing: 1.5px; text-transform: uppercase;
            text-decoration: none; transition: all 0.2s;
        }
        .btn-nav:hover { border-color: #e8ff00; color: #e8ff00; }
        .btn-nav.active { border-color: #e8ff00; color: #e8ff00; }
        .btn-nav.accent { border-color: #e8ff00; color: #e8ff00; }

        .page-wrap { max-width: 820px; margin: 0 auto; padding: 3rem 2rem; }

        .page-header { margin-bottom: 2.5rem; }
        .page-header h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.5rem; letter-spacing: 2px; }
        .page-header p { color: #666; font-size: 0.85rem; margin-top: 0.4rem; }

        .alert { padding: 0.9rem 1.2rem; font-size: 0.85rem; margin-bottom: 1.5rem; border-radius: 2px; }
        .alert-success { background: rgba(232,255,0,0.08); border: 1px solid #e8ff00; color: #e8ff00; }
        .alert-error   { background: rgba(255,45,45,0.08); border: 1px solid #ff2d2d; color: #ff2d2d; }

        /* AVATAR CARD */
        .avatar-card {
            display: flex; align-items: center; gap: 2rem;
            padding: 2rem 2.5rem; background: #111; border: 1px solid #2a2a2a;
            margin-bottom: 2rem;
        }
        .avatar {
            width: 80px; height: 80px; border-radius: 50%;
            background: #e8ff00; color: #0a0a0a;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Bebas Neue', sans-serif; font-size: 2rem; flex-shrink: 0;
        }
        .avatar-info h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.3rem; }
        .avatar-info p  { font-size: 0.82rem; color: #666; margin-bottom: 0.5rem; }
        .member-badge {
            display: inline-block; padding: 3px 12px;
            font-size: 0.65rem; letter-spacing: 1.5px; font-weight: 700;
            text-transform: uppercase;
            background: rgba(232,255,0,0.1); color: #e8ff00; border: 1px solid #e8ff00;
        }

        /* TABS */
        .tabs { display: flex; gap: 0; margin-bottom: 2rem; border-bottom: 1px solid #2a2a2a; }
        .tab {
            padding: 0.8rem 1.8rem; font-size: 0.75rem; letter-spacing: 2px;
            text-transform: uppercase; color: #666; cursor: pointer;
            border-bottom: 2px solid transparent; transition: all 0.2s;
            background: none; border-top: none; border-left: none; border-right: none;
            font-family: 'DM Sans', sans-serif;
        }
        .tab:hover { color: #f5f5f0; }
        .tab.active { color: #e8ff00; border-bottom-color: #e8ff00; }

        /* PANELS */
        .panel { display: none; }
        .panel.active { display: block; }

        /* CARD */
        .card { background: #111; border: 1px solid #2a2a2a; padding: 2rem; margin-bottom: 1.5rem; }
        .card-title {
            font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 2px;
            margin-bottom: 1.5rem; padding-bottom: 0.8rem; border-bottom: 1px solid #2a2a2a;
        }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group:last-child { margin-bottom: 0; }

        label {
            display: block; font-size: 0.68rem; letter-spacing: 2px;
            text-transform: uppercase; color: #666; margin-bottom: 0.5rem;
        }
        input {
            width: 100%; padding: 0.85rem 1rem;
            background: #0a0a0a; border: 1px solid #2a2a2a;
            color: #f5f5f0; font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem; outline: none; transition: border-color 0.2s;
        }
        input:focus   { border-color: #e8ff00; }
        input:disabled { color: #444; cursor: not-allowed; background: #0d0d0d; }

        .btn-save {
            padding: 0.85rem 2rem; background: #e8ff00; color: #0a0a0a;
            border: none; font-family: 'DM Sans', sans-serif; font-weight: 600;
            font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; transition: all 0.2s; margin-top: 0.5rem;
        }
        .btn-save:hover { background: #f5f5f0; }

        /* INFO GRID (read-only view) */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .info-label { font-size: 0.68rem; letter-spacing: 2px; text-transform: uppercase; color: #555; margin-bottom: 0.4rem; }
        .info-value { font-size: 0.95rem; color: #f5f5f0; }

        /* PASSWORD STRENGTH */
        .pwd-hint { font-size: 0.72rem; color: #555; margin-top: 0.4rem; }
    </style>
</head>
<body>

<!-- NAV -->
<nav>
    <a href="/" class="logo">CINE<span>MA</span></a>
    <div class="nav-links">
        <span class="nav-email" sec:authentication="name"></span>
        <a href="/movies" class="btn-nav">Phim</a>
        <a href="/account" class="btn-nav active">Tài khoản</a>
        <a href="/logout" class="btn-nav accent">Đăng xuất</a>
    </div>
</nav>

<div class="page-wrap">

    <div class="page-header">
        <h1>TÀI KHOẢN CỦA TÔI</h1>
        <p>Quản lý thông tin cá nhân và bảo mật tài khoản</p>
    </div>

    <!-- THÔNG BÁO -->
    <div class="alert alert-success" th:if="${success}" th:text="${success}"></div>
    <div class="alert alert-error"   th:if="${error}"   th:text="${error}"></div>

    <!-- AVATAR CARD -->
    <div class="avatar-card">
        <div class="avatar"
             th:text="${#strings.toUpperCase(#strings.substring(user.fullName,0,1))}">A</div>
        <div class="avatar-info">
            <h2 th:text="${user.fullName}">Tên người dùng</h2>
            <p th:text="${user.email}">email@example.com</p>
            <span class="member-badge">✦ Member</span>
        </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
        <button class="tab active" onclick="switchTab('info')">Thông tin</button>
        <button class="tab" onclick="switchTab('password')">Đổi mật khẩu</button>
    </div>

    <!-- PANEL: THÔNG TIN -->
    <div id="panel-info" class="panel active">
        <div class="card">
            <div class="card-title">Chỉnh sửa thông tin</div>
            <form th:action="@{/account/update}" method="post">
                <div class="form-row">
                    <div class="form-group">
                        <label>Họ và tên *</label>
                        <input type="text" name="fullName"
                               th:value="${user.fullName}" required
                               placeholder="Nguyễn Văn A"/>
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="text" name="phone"
                               th:value="${user.phone}"
                               placeholder="0912345678"/>
                    </div>
                </div>
                <div class="form-group">
                    <label>Email (không thể thay đổi)</label>
                    <input type="email" th:value="${user.email}" disabled/>
                </div>
                <button type="submit" class="btn-save">💾 Lưu thay đổi</button>
            </form>
        </div>
    </div>

    <!-- PANEL: ĐỔI MẬT KHẨU -->
    <div id="panel-password" class="panel">
        <div class="card">
            <div class="card-title">Đổi mật khẩu</div>
            <form th:action="@{/account/change-password}" method="post">
                <div class="form-group">
                    <label>Mật khẩu hiện tại</label>
                    <input type="password" name="currentPassword"
                           placeholder="••••••••" required/>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Mật khẩu mới</label>
                        <input type="password" name="newPassword"
                               placeholder="••••••••" required
                               id="newPwd"/>
                        <div class="pwd-hint">Tối thiểu 6 ký tự</div>
                    </div>
                    <div class="form-group">
                        <label>Xác nhận mật khẩu mới</label>
                        <input type="password" name="confirmPassword"
                               placeholder="••••••••" required/>
                    </div>
                </div>
                <button type="submit" class="btn-save">🔒 Đổi mật khẩu</button>
            </form>
        </div>
    </div>

</div>

<script>
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.getElementById('panel-' + tab).classList.add('active');
        event.target.classList.add('active');
    }

    // Tự động mở tab password nếu có lỗi/thành công liên quan đến password
    window.onload = function() {
        const url = window.location.href;
        if (url.includes('tab=password')) {
            switchTab('password');
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.querySelectorAll('.tab')[0].classList.remove('active');
        }
    }
</script>
</body>
</html>
