<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thống kê người dùng</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .summary-card { border-left: 4px solid; border-radius: 8px; }
        .card-total { border-left-color: #0d6efd; }
        .card-active { border-left-color: #198754; }
        .card-inactive { border-left-color: #dc3545; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-4">

    <!-- Tiêu đề -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">👥 Thống kê tài khoản người dùng</h4>
        <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Quản lý người dùng</a>
    </div>

    <!-- Bộ lọc -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <form th:action="@{/admin/users/stats}" method="get" class="row g-3 align-items-end">
                <!-- Chọn năm -->
                <div class="col-md-2">
                    <label class="form-label fw-semibold">Năm</label>
                    <input type="number" name="year" class="form-control"
                           th:value="${year}" min="2020" max="2099">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Xem báo cáo</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Summary cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card shadow-sm summary-card card-total p-3">
                <div class="text-muted small">Tổng người dùng</div>
                <div class="fs-4 fw-bold text-primary" th:text="${totalUsers}"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm summary-card card-active p-3">
                <div class="text-muted small">Đang hoạt động</div>
                <div class="fs-4 fw-bold text-success" th:text="${activeUsers}"></div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow-sm summary-card card-inactive p-3">
                <div class="text-muted small">Đã bị khóa</div>
                <div class="fs-4 fw-bold text-danger" th:text="${inactiveUsers}"></div>
            </div>
        </div>
    </div>

    <!-- Phân loại tài khoản -->
    <div class="row g-3 mb-4">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header fw-semibold">Phân loại tài khoản</div>
                <div class="card-body">
                    <div class="d-flex justify-content-around">
                        <div class="text-center">
                            <h5 class="fw-bold text-dark" th:text="${customerUsers}"></h5>
                            <span class="text-muted small">Khách hàng</span>
                        </div>
                        <div class="text-center">
                            <h5 class="fw-bold text-info" th:text="${staffUsers}"></h5>
                            <span class="text-muted small">Nhân viên</span>
                        </div>
                        <div class="text-center">
                            <h5 class="fw-bold text-warning" th:text="${adminUsers}"></h5>
                            <span class="text-muted small">Quản trị viên</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Biểu đồ -->
    <div class="card shadow-sm mb-4">
        <div class="card-header fw-semibold">Lượng đăng ký mới theo tháng (Năm <span th:text="${year}"></span>)</div>
        <div class="card-body">
            <canvas id="userStatsChart" height="80"></canvas>
        </div>
    </div>

</div>

<!-- Chart.js -->
<script th:inline="javascript">
    const labels = /*[[${chartLabels}]]*/ '';
    const values = /*[[${chartValues}]]*/ '';

    new Chart(document.getElementById('userStatsChart'), {
        type: 'line',
        data: {
            labels: labels ? labels.split(',').map(l => l.replace(/"/g, '')) : [],
            datasets: [{
                label: 'Tài khoản đăng ký mới',
                data: values ? values.split(',').map(Number) : [],
                backgroundColor: 'rgba(13, 110, 253, 0.2)',
                borderColor: 'rgba(13, 110, 253, 1)',
                borderWidth: 2,
                pointBackgroundColor: 'rgba(13, 110, 253, 1)',
                fill: true,
                tension: 0.3
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { display: false },
                tooltip: {
                    callbacks: {
                        label: ctx => ctx.parsed.y + ' tài khoản'
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        stepSize: 1,
                        callback: val => val + ' tài khoản'
                    }
                }
            }
        }
    });
</script>

</body>
</html>
