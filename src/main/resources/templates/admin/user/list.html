<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management | Cinema</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      min-height: 100vh;
      font-family: 'Barlow', sans-serif;
      color: #e0e0e0;
    }

    /* TOP BAR */
    .top-bar {
      background: #111;
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e1e1e;
    }
    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 3px;
      color: #fff;
      text-decoration: none;
    }
    .logo span { color: #c8f000; }
    .admin-btn {
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 8px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: border-color 0.2s, color 0.2s;
      text-decoration: none;
    }
    .admin-btn:hover { border-color: #c8f000; color: #c8f000; }

    /* PAGE CONTENT */
    .page-content {
      padding: 48px 64px;
      max-width: 1400px;
      margin: 0 auto;       /* căn giữa */
      width: 100%;
    }

    .page-label {
      font-size: 11px;
      letter-spacing: 4px;
      color: #c8f000;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .page-label::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 2px;
      background: #c8f000;
    }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
    }
    .page-title .line1 {
      display: block;
      font-size: 72px;
      color: #ffffff;
    }
    .page-title .line2 {
      display: block;
      font-size: 72px;
      color: #c8f000;
    }

    .page-sub {
      color: #444;
      font-size: 13px;
      margin-bottom: 36px;
    }

    /* TOOLBAR */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }
    .search-wrap {
      display: flex;
      flex: 1;
      max-width: 520px;
    }
    .search-input {
      flex: 1;
      background: #111;
      border: 1px solid #222;
      border-right: none;
      color: #ccc;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      padding: 10px 18px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input::placeholder { color: #333; }
    .search-input:focus { border-color: #c8f000; }
    .search-btn {
      background: #c8f000;
      border: none;
      color: #0a0a0a;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 10px 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .search-btn:hover { background: #deff00; }

    .add-btn {
      background: transparent;
      border: 1px solid #c8f000;
      color: #c8f000;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 10px 22px;
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
      display: inline-block;
    }
    .add-btn:hover { background: #c8f000; color: #0a0a0a; }

    /* TABLE */
    .table-wrap {
      border: 1px solid #1a1a1a;
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      min-width: 700px;
    }
    thead tr {
      background: #0e0e0e;
    }
    thead th {
      padding: 16px 20px;
      text-align: left;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #444;
      font-weight: 700;
      border-bottom: 1px solid #1a1a1a;
      white-space: nowrap;
    }
    tbody tr {
      border-bottom: 1px solid #141414;
      transition: background 0.15s;
    }
    tbody tr:hover { background: #111; }
    tbody tr:last-child { border-bottom: none; }

    td {
      padding: 16px 20px;
      color: #888;
      vertical-align: middle;
    }
    td.id-col { color: #333; font-size: 13px; width: 70px; }
    td.name-col { color: #ddd; font-weight: 600; font-size: 14px; }
    td.email-col { color: #555; font-size: 13px; }
    td.phone-col { color: #666; font-size: 13px; letter-spacing: 0.5px; }

    .badge-admin {
      background: #1a1200;
      border: 1px solid #3d2e00;
      color: #c8f000;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      display: inline-block;
    }
    .badge-role {
      background: #151515;
      border: 1px solid #252525;
      color: #555;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      display: inline-block;
    }
    .badge-staff {
      background: #0d1526;
      border: 1px solid #1a3060;
      color: #5b9bd5;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      display: inline-block;
    }
    .badge-active {
      background: #0a1a0d;
      border: 1px solid #143519;
      color: #4caf65;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge-active::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #4caf65;
      flex-shrink: 0;
    }
    .badge-inactive {
      background: #1a0a0a;
      border: 1px solid #351414;
      color: #c0392b;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge-inactive::before {
      content: '';
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c0392b;
      flex-shrink: 0;
    }

    .action-wrap { display: flex; gap: 8px; }
    .action-btn {
      font-family: 'Barlow', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 6px 14px;
      cursor: pointer;
      border: 1px solid;
      background: transparent;
      text-decoration: none;
      display: inline-block;
      transition: background 0.15s, color 0.15s;
    }
    .btn-edit { border-color: #c8960a; color: #c8960a; }
    .btn-edit:hover { background: #c8960a; color: #0a0a0a; }
    .btn-del { border-color: #c0392b; color: #c0392b; }
    .btn-del:hover { background: #c0392b; color: #fff; }

    /* FOOTER */
    .footer-bar {
      margin-top: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #222;
    }
    .online-dot {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #2a2a2a;
    }
    .online-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c8f000;
    }

    /* EMPTY STATE */
    .empty-row td {
      text-align: center;
      color: #333;
      padding: 40px;
      font-size: 13px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <a href="/admin" class="logo">CINE<span>MA</span></a>
    <a href="/admin" class="admin-btn">⚙&nbsp; ADMIN</a>
  </div>

  <!-- MAIN CONTENT -->
  <div class="page-content">
    <div class="page-label">Quản lý hệ thống</div>
    <div class="page-title">
      <span class="line1">NGƯỜI</span>
      <span class="line2">DÙNG</span>
    </div>
    <p class="page-sub">Quản lý tài khoản người dùng trong hệ thống</p>

    <!-- TOOLBAR -->
    <div class="toolbar">
      <div class="search-wrap">
        <input
          class="search-input"
          id="searchInput"
          type="text"
          placeholder="Tìm theo tên..."
          oninput="filterTable()"
        >
        <button class="search-btn" onclick="filterTable()">Tìm</button>
      </div>
      <div style="display: flex; gap: 10px;">
        <a th:href="@{/admin/users/stats}" class="add-btn" style="border-color: #378ADD; color: #378ADD;">Thống kê người dùng</a>
        <a th:href="@{/admin/users/add}" class="add-btn">+ Thêm người dùng</a>
      </div>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>SĐT</th>
            <th>Role</th>
            <th>Trạng thái</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <tr th:each="user : ${users}">
            <td class="id-col" th:text="${user.id}"></td>
            <td class="name-col" th:text="${user.fullName}"></td>
            <td class="email-col" th:text="${user.email}"></td>
            <td class="phone-col" th:text="${user.phone}"></td>
            <td>
              <span th:if="${user.role != null and user.role.name() == 'admin'}" class="badge-admin">admin</span>
              <span th:if="${user.role != null and user.role.name() == 'staff'}" class="badge-staff">staff</span>
              <span th:if="${user.role == null or user.role.name() == 'customer'}" class="badge-role">customer</span>
            </td>
            <td>
              <span th:if="${user.isActive}" class="badge-active">Hoạt động</span>
              <span th:unless="${user.isActive}" class="badge-inactive">Vô hiệu</span>
            </td>
            <td>
              <div class="action-wrap">
                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="action-btn btn-edit">Sửa</a>
                <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="action-btn btn-del" onclick="return confirm('Xoá user này?')">Xoá</a>
              </div>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="7">Không có người dùng nào.</td>
          </tr>
          <!-- hardcoded rows removed -->
        </tbody>
      </table>
    </div>

    <!-- FOOTER -->
    <div class="footer-bar">
      <span>☰ Hệ thống quản trị &nbsp;|&nbsp; ⓘ Bảo mật cao</span>
      <span class="online-dot">ONLINE</span>
    </div>
  </div>

  <script>
    function filterTable() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const rows = document.querySelectorAll('#tableBody tr');
      let found = false;

      rows.forEach(r => {
        if (r.classList.contains('empty-row')) { r.remove(); return; }
        const name = r.cells[1].textContent.toLowerCase();
        const email = r.cells[2].textContent.toLowerCase();
        const show = name.includes(q) || email.includes(q);
        r.style.display = show ? '' : 'none';
        if (show) found = true;
      });

      const existing = document.querySelector('.empty-row');
      if (existing) existing.remove();

      if (!found) {
        const empty = document.createElement('tr');
        empty.className = 'empty-row';
        empty.innerHTML = '<td colspan="7">Không tìm thấy người dùng</td>';
        document.getElementById('tableBody').appendChild(empty);
      }
    }
  </script>
</body>
</html>
