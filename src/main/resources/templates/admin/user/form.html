<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Form | Cinema</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;900&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      min-height: 100vh;
      font-family: 'Barlow', sans-serif;
      color: #e0e0e0;
    }

    /* TOP BAR */
    .top-bar {
      background: #111;
      padding: 14px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e1e1e;
    }
    .logo {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      font-size: 22px;
      letter-spacing: 3px;
      color: #fff;
      text-decoration: none;
    }
    .logo span { color: #c8f000; }
    .admin-btn {
      background: transparent;
      border: 1px solid #333;
      color: #aaa;
      font-family: 'Barlow', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 8px 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .admin-btn:hover { border-color: #c8f000; color: #c8f000; }

    /* PAGE CONTENT */
    .page-content {
      padding: 48px 64px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .page-label {
      font-size: 11px;
      letter-spacing: 4px;
      color: #c8f000;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .page-label::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 2px;
      background: #c8f000;
    }

    .page-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
    }
    .page-title .line1 { display: block; font-size: 72px; color: #ffffff; }
    .page-title .line2 { display: block; font-size: 72px; color: #c8f000; }

    .page-sub {
      color: #444;
      font-size: 13px;
      margin-bottom: 40px;
    }

    /* FORM CARD */
    .form-card {
      border: 1px solid #1a1a1a;
      background: #0e0e0e;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .form-card-header {
      padding: 18px 28px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .form-card-header-bar {
      width: 3px;
      height: 20px;
      background: #c8f000;
    }
    .form-card-header h4 {
      font-family: 'Barlow Condensed', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #ccc;
      margin: 0;
    }

    .form-card-body {
      padding: 32px 28px;
    }

    /* FORM FIELDS */
    .field-group {
      margin-bottom: 24px;
    }
    .field-label {
      display: block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 8px;
    }
    .field-input,
    .field-select {
      width: 100%;
      background: #111;
      border: 1px solid #222;
      color: #ccc;
      font-family: 'Barlow', sans-serif;
      font-size: 14px;
      padding: 11px 16px;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      appearance: none;
      -webkit-appearance: none;
    }
    .field-input::placeholder { color: #333; }
    .field-input:focus,
    .field-select:focus {
      border-color: #c8f000;
      background: #131313;
    }

    .select-wrap {
      position: relative;
    }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #444;
      pointer-events: none;
      font-size: 12px;
    }
    .field-select {
      cursor: pointer;
    }
    .field-select option {
      background: #111;
      color: #ccc;
    }

    .field-error {
      display: block;
      font-size: 11px;
      color: #c0392b;
      letter-spacing: 0.5px;
      margin-top: 5px;
      min-height: 16px;
    }

    /* DIVIDER */
    .field-divider {
      border: none;
      border-top: 1px solid #161616;
      margin: 8px 0 24px;
    }

    /* BUTTONS */
    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .btn-back {
      background: transparent;
      border: 1px solid #333;
      color: #666;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 10px 22px;
      text-decoration: none;
      display: inline-block;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-back:hover { border-color: #666; color: #aaa; }

    .btn-save {
      background: #c8f000;
      border: none;
      color: #0a0a0a;
      font-family: 'Barlow', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 10px 30px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-save:hover { background: #deff00; }

    /* FOOTER */
    .footer-bar {
      margin-top: 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #222;
    }
    .online-dot {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #2a2a2a;
    }
    .online-dot::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #c8f000;
    }
  </style>
</head>
<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <a href="/admin" class="logo">CINE<span>MA</span></a>
    <a href="/admin" class="admin-btn">⚙&nbsp; ADMIN</a>
  </div>

  <!-- MAIN CONTENT -->
  <div class="page-content">
    <div class="page-label">Quản lý hệ thống</div>
    <div class="page-title">
      <span class="line1">THÊM / SỬA</span>
      <span class="line2">NGƯỜI DÙNG</span>
    </div>
    <p class="page-sub">Điền thông tin để thêm mới hoặc cập nhật tài khoản người dùng</p>

    <!-- FORM CARD -->
    <div class="form-card">
      <div class="form-card-header">
        <div class="form-card-header-bar"></div>
        <h4>Thông tin người dùng</h4>
      </div>
      <div class="form-card-body">

        <!-- Error banner -->
        <div th:if="${errorMessage}" style="
          background: #1a0a0a;
          border: 1px solid #c0392b;
          color: #e74c3c;
          font-size: 13px;
          padding: 12px 18px;
          margin-bottom: 24px;
          display: flex;
          align-items: center;
          gap: 10px;
          letter-spacing: 0.3px;
        ">⚠&nbsp; <span th:text="${errorMessage}"></span></div>

        <form th:action="@{/admin/users/save}"
              th:object="${user}"
              method="post"
              onsubmit="return validateForm()">

          <input type="hidden" th:field="*{id}" />

          <!-- Họ tên -->
          <div class="field-group">
            <label class="field-label" for="fullName">Họ tên</label>
            <input type="text" id="fullName" class="field-input"
                   th:field="*{fullName}" placeholder="Nhập họ tên" required>
            <small id="fullNameError" class="field-error"></small>
          </div>

          <!-- Email -->
          <div class="field-group">
            <label class="field-label" for="email">Email</label>
            <input type="email" id="email" class="field-input"
                   th:field="*{email}" placeholder="Nhập email" required>
            <small id="emailError" class="field-error"></small>
          </div>

          <!-- Số điện thoại -->
          <div class="field-group">
            <label class="field-label" for="phone">Số điện thoại</label>
            <input type="text" id="phone" class="field-input"
                   th:field="*{phone}" placeholder="Nhập số điện thoại">
            <small id="phoneError" class="field-error"></small>
          </div>

          <!-- Mật khẩu -->
          <div class="field-group">
            <label class="field-label" for="passwordHash">Mật khẩu</label>
            <input type="password" id="passwordHash" class="field-input"
                   th:field="*{passwordHash}" placeholder="Nhập mật khẩu" required>
            <small id="passwordError" class="field-error"></small>
          </div>

          <hr class="field-divider">

          <!-- Role -->
          <div class="field-group">
            <label class="field-label">Role</label>
            <div class="select-wrap">
              <select class="field-select" name="role">
                <option th:each="r : ${T(com.cinema.booking.model.User.Role).values()}"
                        th:value="${r.name()}"
                        th:text="${#strings.capitalize(r.name().toLowerCase())}"
                        th:selected="${r.name() == user.role?.name()}">
                </option>
              </select>
            </div>
          </div>

          <!-- Trạng thái -->
          <div class="field-group">
            <label class="field-label">Trạng thái</label>
            <div class="select-wrap">
              <select class="field-select" name="isActive">
                <option value="true"  th:selected="${user.isActive == true}">Hoạt động</option>
                <option value="false" th:selected="${user.isActive == false}">Khóa</option>
              </select>
            </div>
          </div>

          <!-- Buttons -->
          <div class="form-actions">
            <a href="/admin/users" class="btn-back">← Quay lại</a>
            <button type="submit" class="btn-save">Lưu</button>
          </div>

        </form>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer-bar">
      <span>☰ Hệ thống quản trị &nbsp;|&nbsp; ⓘ Bảo mật cao</span>
      <span class="online-dot">ONLINE</span>
    </div>
  </div>

  <script>
    function validateForm() {
      let isValid = true;

      document.getElementById("fullNameError").innerText = "";
      document.getElementById("emailError").innerText = "";
      document.getElementById("phoneError").innerText = "";
      document.getElementById("passwordError").innerText = "";

      // Validate Họ tên
      let fullName = document.getElementById("fullName").value.trim();
      if (fullName === "") {
        document.getElementById("fullNameError").innerText = "Họ tên không được để trống.";
        document.getElementById("fullName").focus();
        isValid = false;
      }

      // Validate Email
      let email = document.getElementById("email").value.trim();
      let emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (email === "") {
        document.getElementById("emailError").innerText = "Email không được để trống.";
        if (isValid) document.getElementById("email").focus();
        isValid = false;
      } else if (!emailRegex.test(email)) {
        document.getElementById("emailError").innerText = "Email không đúng định dạng.";
        if (isValid) document.getElementById("email").focus();
        isValid = false;
      }

      // Validate Số điện thoại (nếu có nhập)
      let phone = document.getElementById("phone").value.trim();
      let phoneRegex = /^[0-9]{10,11}$/;
      if (phone !== "" && !phoneRegex.test(phone)) {
        document.getElementById("phoneError").innerText = "Số điện thoại phải có 10-11 chữ số.";
        if (isValid) document.getElementById("phone").focus();
        isValid = false;
      }

      // Validate Mật khẩu
      let password = document.getElementById("passwordHash").value;
      if (password === "") {
        document.getElementById("passwordError").innerText = "Mật khẩu không được để trống.";
        if (isValid) document.getElementById("passwordHash").focus();
        isValid = false;
      } else if (password.length < 6) {
        document.getElementById("passwordError").innerText = "Mật khẩu phải có ít nhất 6 ký tự.";
        if (isValid) document.getElementById("passwordHash").focus();
        isValid = false;
      }

      return isValid;
    }
  </script>

</body>
</html>
