<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Movie Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Thêm / Sửa phim</h4>
        </div>

        <div class="card-body">
            <form th:action="@{/admin/movies/save}"
                  th:object="${movie}"
                  method="post"
                  onsubmit="return validateForm()">

                <input type="hidden" th:field="*{id}" />

                <!-- Tên phim -->
                <div class="mb-3">
                    <label class="form-label">Tên phim</label>
                    <input type="text" id="title" class="form-control"
                           th:field="*{title}" placeholder="Nhập tên phim">
                    <small id="titleError" class="text-danger"></small>
                </div>

                <!-- Mô tả -->
                <div class="mb-3">
                    <label class="form-label">Mô tả</label>
                    <textarea id="description" class="form-control" rows="3"
                              th:field="*{description}" placeholder="Nhập mô tả phim"></textarea>
                </div>

                <!-- Diễn viên -->
                <div class="mb-3">
                    <label class="form-label">Diễn viên</label>
                    <input type="text" id="actors" class="form-control"
                           th:field="*{actors}" placeholder="Nhập tên diễn viên">
                </div>

                <!-- Thời lượng -->
                <div class="mb-3">
                    <label class="form-label">Thời lượng (phút)</label>
                    <input type="number" id="duration" class="form-control"
                           th:field="*{duration}" placeholder="Nhập thời lượng" min="1">
                    <small id="durationError" class="text-danger"></small>
                </div>

                <!-- Rated -->
                <div class="mb-3">
                    <label class="form-label">Rated</label>
                    <select class="form-select" th:field="*{rated}">
                        <option value="">-- Chọn rated --</option>
                        <option value="P">P</option>
                        <option value="C13">C13</option>
                        <option value="C16">C16</option>
                        <option value="C18">C18</option>
                    </select>
                </div>

                <!-- Ngày phát hành -->
                <div class="mb-3">
                    <label class="form-label">Ngày phát hành</label>
                    <input type="date" id="releaseDate" class="form-control"
                           th:field="*{releaseDate}">
                    <small id="releaseDateError" class="text-danger"></small>
                </div>

                <!-- Ngày kết thúc -->
                <div class="mb-3">
                    <label class="form-label">Ngày kết thúc</label>
                    <input type="date" id="endDate" class="form-control"
                           th:field="*{endDate}">
                    <small id="endDateError" class="text-danger"></small>
                </div>

                <!-- Poster URL -->
                <div class="mb-3">
                    <label class="form-label">Poster URL</label>
                    <input type="text" class="form-control"
                           th:field="*{posterUrl}" placeholder="Nhập link poster">
                </div>

                <!-- Trailer URL -->
                <div class="mb-3">
                    <label class="form-label">Trailer URL</label>
                    <input type="text" class="form-control"
                           th:field="*{trailerUrl}" placeholder="Nhập link trailer">
                </div>

                <!-- Trạng thái -->
                <div class="mb-3">
                    <label class="form-label">Trạng thái</label>
                    <select class="form-select" name="status">
                        <option value="coming_soon" th:selected="${movie.status?.name() == 'coming_soon'}">Sắp chiếu</option>
                        <option value="now_showing" th:selected="${movie.status?.name() == 'now_showing'}">Đang chiếu</option>
                        <option value="ended"       th:selected="${movie.status?.name() == 'ended'}">Đã kết thúc</option>
                    </select>
                </div>

                <!-- Buttons -->
                <div class="d-flex justify-content-between">
                    <a href="/admin/movies" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-success">Lưu</button>
                </div>

            </form>
        </div>
    </div>
</div>

<script>
    function validateForm() {
        let isValid = true;

        document.getElementById("titleError").innerText = "";
        document.getElementById("durationError").innerText = "";
        document.getElementById("releaseDateError").innerText = "";
        document.getElementById("endDateError").innerText = "";

        // Validate tên phim
        let title = document.getElementById("title").value.trim();
        if (title === "") {
            document.getElementById("titleError").innerText = "Tên phim không được để trống.";
            document.getElementById("title").focus();
            isValid = false;
        }

        // Validate thời lượng
        let duration = document.getElementById("duration").value;
        if (duration === "" || parseInt(duration) <= 0) {
            document.getElementById("durationError").innerText = "Thời lượng phải lớn hơn 0.";
            if (isValid) document.getElementById("duration").focus();
            isValid = false;
        }

        // Validate ngày phát hành & kết thúc
        let releaseDate = document.getElementById("releaseDate").value;
        let endDate = document.getElementById("endDate").value;
        if (releaseDate && endDate && endDate < releaseDate) {
            document.getElementById("endDateError").innerText = "Ngày kết thúc phải sau ngày phát hành.";
            if (isValid) document.getElementById("endDate").focus();
            isValid = false;
        }

        return isValid;
    }
</script>

</body>
</html>
