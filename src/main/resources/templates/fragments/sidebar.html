<div th:fragment="sidebar">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-3">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">HỆ THỐNG CINEMA BOOKING</span>
            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <th:block th:each="menu : ${menus}">
                        <th:block th:if="${menu.menuName != null and !menu.menuName.trim().toLowerCase().equals('khuyến mãi')}">
                            <th:block th:replace="~{fragments/menu-item :: menuItem(${menu})}"></th:block>
                        </th:block>
                    </th:block>
                </ul>
            </div>
        </div>
    </nav>
</div>
